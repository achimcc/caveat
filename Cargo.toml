[package]
name = "caveat"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Shows a repository's known pitfall at the moment its error message appears: a Claude Code hook over a directory of caveats"
repository = "https://github.com/achimcc/caveat"
readme = "README.md"
keywords = ["claude", "hook", "cli", "lessons"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
