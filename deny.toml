# cargo-deny: what may enter the dependency tree.
#
# Advisories are NOT checked here but by the `audit` flake check
# (`cargo-audit` against the pinned RustSec database). cargo-deny wants a git
# checkout of that database; a flake input is a plain tree.

[graph]
all-features = true

[bans]
# Two versions of one crate are worth knowing about, not worth a red build.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
confidence-threshold = 0.8
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
